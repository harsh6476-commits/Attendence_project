<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome — IIIT Dharwad Attendance Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .welcome-container {
      text-align: center;
      animation: fadeIn 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .welcome-icon {
      width: 80px;
      height: 80px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 32px;
    }

    .welcome-icon svg {
      width: 40px;
      height: 40px;
      color: #fff;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: 8px;
    }

    .username-display {
      font-size: 1.25rem;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 24px;
    }

    .role-badge {
      display: inline-block;
      padding: 6px 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 48px;
    }

    .logout-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.6);
      padding: 12px 32px;
      border-radius: 12px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
    }

    .logout-btn:hover {
      background: #fff;
      color: #000;
      border-color: #fff;
    }

    .loading-state {
      color: rgba(255, 255, 255, 0.3);
      font-size: 0.875rem;
    }

    .loading-state .dot {
      animation: blink 1.4s infinite;
    }
    .loading-state .dot:nth-child(2) { animation-delay: 0.2s; }
    .loading-state .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 20% { opacity: 0; }
      50%     { opacity: 1; }
      100%    { opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Loading State -->
  <div id="loadingState" class="welcome-container">
    <p class="loading-state">
      Loading<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
    </p>
  </div>

  <!-- Welcome Content (hidden until loaded) -->
  <div id="welcomeContent" class="welcome-container" style="display: none;">
    <div class="welcome-icon">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
      </svg>
    </div>
    <h1>Welcome,</h1>
    <p class="username-display" id="usernameDisplay"></p>
    <div class="role-badge" id="roleBadge"></div>
    <br />
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <script src="/js/welcome.js"></script>
</body>
</html>
