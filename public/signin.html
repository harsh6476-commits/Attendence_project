<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — IIIT Dharwad Attendance Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    * { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="gradient-bg flex items-center justify-center min-h-screen p-4">

  <!-- ── Floating Orbs ─────────────────────────────────────────── -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- ── Toast Container ───────────────────────────────────────── -->
  <div id="toast" class="toast toast-error" role="alert"></div>

  <!-- ── Main Card ─────────────────────────────────────────────── -->
  <div class="glass-card w-full max-w-md px-8 py-10 page-enter">

    <!-- Logo & Branding -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-violet-500/30 to-blue-500/30 border border-white/10 flex items-center justify-center mb-4 shadow-lg shadow-violet-500/10">
        <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.147a60.438 60.438 0 0 0-.491 6.347A48.62 48.62 0 0 1 12 20.904a48.62 48.62 0 0 1 8.232-4.41 60.46 60.46 0 0 0-.491-6.347m-15.482 0a50.636 50.636 0 0 0-2.658-.813A59.906 59.906 0 0 1 12 3.493a59.903 59.903 0 0 1 10.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.717 50.717 0 0 1 12 13.489a50.702 50.702 0 0 1 7.74-3.342M6.75 15a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm0 0v-3.675A55.378 55.378 0 0 1 12 8.443m-7.007 11.55A5.981 5.981 0 0 0 6.75 15.75v-1.5" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-white tracking-tight">Welcome Back</h1>
      <p class="text-white/40 text-sm mt-1">Sign in to your IIIT Dharwad account</p>
    </div>

    <!-- Role Toggle -->
    <div class="role-toggle-wrapper flex mb-6">
      <button type="button" id="roleStudent" class="role-btn active flex-1" onclick="setRole('student')">
        🎓 Student
      </button>
      <button type="button" id="roleTeacher" class="role-btn flex-1" onclick="setRole('teacher')">
        👨‍🏫 Teacher
      </button>
    </div>

    <!-- Sign In Form -->
    <form id="signinForm" autocomplete="off" novalidate>

      <!-- Email -->
      <div class="mb-5">
        <label class="block text-white/70 text-sm font-medium mb-1.5">Email</label>
        <div class="relative">
          <input
            type="email"
            id="email"
            class="glass-input w-full px-4 py-3.5 pr-11 text-sm"
            placeholder="25bcs049@iiitdwd.ac.in"
            autocomplete="email"
            spellcheck="false"
          />
          <div class="absolute right-3.5 top-1/2 -translate-y-1/2 text-white/25">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
            </svg>
          </div>
        </div>
        <p id="emailError" class="text-xs text-red-400/80 mt-1 hidden"></p>
      </div>

      <!-- Password -->
      <div class="mb-6">
        <label class="block text-white/70 text-sm font-medium mb-1.5">Password</label>
        <div class="relative">
          <input
            type="password"
            id="password"
            class="glass-input w-full px-4 py-3.5 pr-11 text-sm"
            placeholder="Enter your password"
            autocomplete="current-password"
          />
          <button type="button" class="toggle-password absolute right-3.5 top-1/2 -translate-y-1/2" onclick="togglePasswordVisibility('password', this)">
            <svg class="w-5 h-5 eye-open" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>
            <svg class="w-5 h-5 eye-closed hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12c1.292 4.338 5.31 7.5 10.066 7.5.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn" class="btn-primary w-full text-sm">
        <span id="submitText">Sign In</span>
      </button>
    </form>

    <!-- Divider -->
    <div class="auth-divider my-6">
      <span class="line"></span>
      <span class="text-white/30 text-xs font-medium tracking-wider uppercase">or</span>
      <span class="line"></span>
    </div>

    <!-- Google Sign In -->
    <button id="googleBtn" class="btn-google w-full text-sm flex items-center justify-center gap-3">
      <svg class="w-5 h-5" viewBox="0 0 24 24">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Sign in with Google
    </button>

    <!-- Link to Sign Up -->
    <p class="text-center text-white/40 text-sm mt-8">
      Don't have an account?
      <a href="/signup.html" class="text-violet-300 hover:text-violet-200 font-semibold link-glow transition-all">Sign Up</a>
    </p>
  </div>

  <script src="/js/signin.js"></script>
</body>
</html>
