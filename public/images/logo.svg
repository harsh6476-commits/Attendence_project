<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" width="100%" height="100%">
  <style>
    .navy-fill { fill: #0b1e3a; }
    .text-en {
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      fill: #ffffff;
      font-size: 32px;
      letter-spacing: 0.52em;
    }
    .text-devanagari {
      font-family: 'Noto Sans Devanagari', 'Arial Unicode MS', sans-serif;
      font-weight: 700;
      fill: #0b1e3a;
      font-size: 35px;
      word-spacing: 0.2em;
    }
  </style>

  <!-- Background -->
  <rect width="500" height="520" fill="#ffffff"/>

  <g transform="translate(10, 0)">
    <!-- Column 1 (Leftmost dot & bar) -->
    <rect x="35" y="165" width="53" height="50" class="navy-fill" />
    <rect x="35" y="246" width="53" height="65" class="navy-fill" />

    <!-- Column 2 (First 'i') -->
    <rect x="125" y="108" width="56" height="52" class="navy-fill" />
    <rect x="125" y="188" width="56" height="123" class="navy-fill" />

    <!-- Column 3 (Second 'i') -->
    <rect x="220" y="55" width="58" height="53" class="navy-fill" />
    <rect x="220" y="137" width="58" height="174" class="navy-fill" />

    <!-- Column 4 ('T') -->
    <rect x="320" y="55" width="128" height="53" class="navy-fill" />
    <rect x="350" y="137" width="54" height="174" class="navy-fill" />

    <!-- Dark Blue Banner -->
    <rect x="35" y="342" width="413" height="55" class="navy-fill" />

    <!-- English Text "Dharwad" -->
    <text x="73" y="381" class="text-en">Dharwad</text>

    <!-- Devanagari Motto "ज्ञानेन विकासः" -->
    <text x="241" y="460" class="text-devanagari" text-anchor="middle">ज्ञानेन विकासः</text>
  </g>
</svg>
